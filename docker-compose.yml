services:
  mongo:
    image: mongo:latest
    container_name: todo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - todo-network

  backend:
    image: ghcr.io/${{ github.repository }}/backend:${IMAGE_TAG}
    container_name: todo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/todoapp_for_devops
      - PORT=5000
    depends_on:
      - mongo
    networks:
      - todo-network

  frontend:
    image: ghcr.io/${{ github.repository }}/frontend:${IMAGE_TAG}
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=/api/todos
    depends_on:
      - backend
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  mongo-data:
